  <style>
/* ============================================================================
   cuaderno · styles.css
   Papel cálido + tipografía editorial para el texto, sans para los datos.
   ========================================================================== */

:root {
  --paper: #f3efe6;
  --paper-2: #ece6d9;
  --surface: #fffdf7;
  --ink: #1b1713;
  --ink-2: #3d362e;
  --muted: #6f6658;
  --line: #e0d8c8;
  --line-2: #cfc4ae;
  --accent: #a52a1b;
  --accent-ink: #fff7f3;
  --green: #1f6b4f;
  --amber: #a9751b;
  --red: #a52a1b;
  --blue: #27506f;
  --shadow: 0 1px 2px rgba(27, 23, 19, .05), 0 8px 24px -18px rgba(27, 23, 19, .35);
  --radius: 14px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  --paper: #14110e;
  --paper-2: #1a1613;
  --surface: #1e1a16;
  --ink: #f2ece1;
  --ink-2: #ded6c8;
  --muted: #a2968680;
  --muted: #a29686;
  --line: #302a23;
  --line-2: #423a31;
  --accent: #e2664d;
  --accent-ink: #1a1009;
  --green: #62b992;
  --amber: #d9a45a;
  --red: #e2664d;
  --blue: #7fb0d4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -20px #000;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
small { font-size: .8rem; }
.num, .tnum { font-variant-numeric: tabular-nums; }

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1120px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.brand span.sub { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1 1 auto; }
.chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-2); color: var(--ink-2);
  background: var(--surface);
  padding: 3px 9px; border-radius: 999px;
  font-size: .76rem; line-height: 1.4; white-space: nowrap;
}
.chip.accent { border-color: var(--accent); color: var(--accent); }
.chip.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.green { border-color: var(--green); color: var(--green); }
.chip.amber { border-color: var(--amber); color: var(--amber); }
.chip.red { border-color: var(--red); color: var(--red); }

.save {
  font-size: .74rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
  min-width: 74px; justify-content: flex-end;
}
.save .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.save.saving .dot { background: var(--amber); }

/* ---------- pestañas ---------- */
.tabs {
  position: sticky; top: 57px; z-index: 39;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs-in { max-width: 1120px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: .86rem; color: var(--muted);
  padding: 12px 14px 11px; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

/* ---------- estructura ---------- */
main { max-width: 1120px; margin: 0 auto; padding: 22px 20px 120px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head h1 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.12; }
.view-head .kicker { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 4px; }
.view-head p { color: var(--muted); font-size: .9rem; margin: 4px 0 0; max-width: 62ch; }

.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.between { justify-content: space-between; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
}
.card.tight { padding: 12px 14px; }
.card h2 { font-size: 1.08rem; }
.card h3 { font-size: .98rem; }
.card .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card .card-title .meta { color: var(--muted); font-size: .78rem; }

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--serif); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat .d { font-size: .78rem; color: var(--muted); }

.hint { color: var(--muted); font-size: .82rem; }
.tiny { font-size: .72rem; }
.mono { font-family: var(--mono); font-size: .84em; }
.accent { color: var(--accent); }
.green { color: var(--green); }
.amber { color: var(--amber); }
.red { color: var(--red); }
.muted { color: var(--muted); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ---------- botones ---------- */
.btn {
  appearance: none; font: inherit; font-size: .86rem; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  padding: 8px 13px; border-radius: 10px; line-height: 1.2;
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--paper-2); }
.btn.sm { font-size: .78rem; padding: 5px 9px; min-height: 30px; border-radius: 8px; }
.btn.icon { padding: 6px; min-height: 30px; width: 30px; justify-content: center; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; justify-content: center; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button {
  appearance: none; border: 0; background: none; font: inherit; font-size: .8rem;
  padding: 7px 13px; cursor: pointer; color: var(--muted); min-height: 34px;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }

/* ---------- stepper ---------- */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); }
.stepper button { appearance: none; border: 0; background: none; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; color: var(--ink-2); }
.stepper button:hover { background: var(--paper-2); }
.stepper .val { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-size: .88rem; font-weight: 600; }

/* ---------- inputs ---------- */
input[type="number"], input[type="text"], input[type="date"], select, textarea {
  font: inherit; font-size: .88rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; min-height: 34px;
  width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent); }
input[type="number"] { text-align: center; font-variant-numeric: tabular-nums; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
label.fld > input, label.fld > select { text-transform: none; letter-spacing: 0; }

/* ---------- sesión de hoy ---------- */
.session-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.session-head h1 { font-size: clamp(1.4rem, 3vw, 1.9rem); }
.session-focus { color: var(--muted); font-size: .88rem; }
.session-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.session-stats .stat .v { font-size: 1.35rem; }

.ex { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.ex + .ex { margin-top: 10px; }
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 14px; background: linear-gradient(var(--surface), color-mix(in srgb, var(--paper) 55%, var(--surface))); border-bottom: 1px solid var(--line); }
.ex-title { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ex-title b { font-size: .98rem; font-weight: 600; }
.ex-title .spec { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.ex-title .prev { color: var(--muted); font-size: .74rem; }
.ex-body { padding: 10px 14px 12px; }
.ex.is-done { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.ex.is-done .ex-head { background: color-mix(in srgb, var(--green) 7%, var(--surface)); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 26px 1fr 1fr .9fr 34px; gap: 6px; align-items: center; }
.set-row .idx { font-size: .74rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.set-row input { min-height: 38px; font-size: .95rem; }
.set-row .check {
  appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px;
  width: 34px; height: 38px; cursor: pointer; color: var(--muted); font-size: .9rem;
  display: grid; place-items: center;
}
.set-row .check[aria-checked="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.set-labels { display: grid; grid-template-columns: 26px 1fr 1fr .9fr 34px; gap: 6px; font-size: .66rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding-bottom: 2px; }
.set-labels span:nth-child(2), .set-labels span:nth-child(3) { text-align: center; }
.set-labels span:nth-child(4) { text-align: center; }

.advice { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--paper) 70%, var(--surface)); border: 1px dashed var(--line-2); font-size: .8rem; color: var(--ink-2); }
.advice .ico { flex: 0 0 auto; }
.advice.up { border-color: color-mix(in srgb, var(--green) 50%, var(--line)); background: color-mix(in srgb, var(--green) 7%, var(--surface)); }
.advice.down { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); background: color-mix(in srgb, var(--red) 6%, var(--surface)); }
.advice b { font-weight: 600; }

.ex-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; flex-wrap: wrap; }
.load-edit { display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--muted); }

/* ---------- tabla ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: .84rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.c, .tbl th.c { text-align: center; font-variant-numeric: tabular-nums; }
.tbl tr.is-today td { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* ---------- barra de volumen ---------- */
.vol-row { display: grid; grid-template-columns: minmax(104px, 132px) 1fr 44px; gap: 10px; align-items: center; padding: 5px 0; }
.vol-row .name { font-size: .82rem; color: var(--ink-2); }
.vol-row .name small { color: var(--muted); font-size: .72rem; }
.vol-row .val.low { color: var(--amber); }
.vol-row .val.high { color: var(--red); }
.vol-row .val.ok { color: var(--green); }
.vol-row .val { font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.vol-track { position: relative; height: 16px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.vol-band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--green) 16%, transparent); border-left: 1px solid color-mix(in srgb, var(--green) 40%, transparent); border-right: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }
.vol-fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 3px; background: var(--ink-2); }
.vol-fill.ok { background: var(--green); }
.vol-fill.low { background: var(--amber); }
.vol-fill.high { background: var(--red); }

/* ---------- progreso ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--sans); font-size: 10px; fill: var(--muted); }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .bar { fill: var(--ink-2); }
.chart .bar.today { fill: var(--accent); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }

.empty { padding: 26px 18px; text-align: center; color: var(--muted); font-size: .88rem; border: 1px dashed var(--line-2); border-radius: 12px; }

/* ---------- semana ---------- */
.day-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.day-row + .day-row { margin-top: 8px; }
.day-row .dow { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.day-row .what b { font-size: .92rem; }
.day-row .what span { display: block; color: var(--muted); font-size: .78rem; }
.day-row.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.day-row.is-rest { background: transparent; border-style: dashed; }

/* ---------- documento ---------- */
.doc { max-width: 74ch; margin-left: auto; margin-right: auto; }
.doc h2 { font-size: 1.35rem; margin: 2em 0 .5em; }
.doc h3 { font-size: 1.05rem; margin: 1.6em 0 .4em; }
.doc p { font-size: 1.02rem; line-height: 1.62; color: var(--ink-2); }
.doc p.lead { font-size: 1.12rem; color: var(--ink); }
.doc blockquote { margin: 1.2em 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); font-family: var(--serif); font-size: 1.02rem; color: var(--ink-2); }
.doc .note { font-size: .84rem; color: var(--muted); }
.doc table { font-size: .86rem; }

/* ---------- temporizador ---------- */
.timer {
  position: fixed; right: 18px; bottom: 18px; z-index: 60;
  background: var(--ink); color: var(--paper); border-radius: 14px;
  padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  font-variant-numeric: tabular-nums;
}
.timer .t { font-family: var(--serif); font-size: 1.4rem; min-width: 62px; }
.timer .lab { font-size: .68rem; opacity: .7; text-transform: uppercase; letter-spacing: .1em; }
.timer button { appearance: none; border: 1px solid rgba(255,255,255,.22); background: none; color: inherit; border-radius: 8px; padding: 5px 8px; font: inherit; font-size: .78rem; cursor: pointer; }
.timer button:hover { background: rgba(255,255,255,.12); }
.timer.done { background: var(--green); }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; background: rgba(20,16,12,.45); backdrop-filter: blur(2px); padding: 0; }
.modal[hidden] { display: none; }
.sheet {
  background: var(--surface); width: min(660px, 100%); max-height: 92vh; overflow: auto;
  border-radius: 18px 18px 0 0; border: 1px solid var(--line);
  padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px -20px rgba(0,0,0,.5);
}
@media (min-width: 720px) {
  .modal { align-items: center; padding: 24px; }
  .sheet { border-radius: 18px; }
}
.sheet h2 { font-size: 1.25rem; margin-bottom: 4px; }
.sheet .sub { color: var(--muted); font-size: .86rem; margin-bottom: 14px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; position: sticky; bottom: 0; background: linear-gradient(transparent, var(--surface) 30%); padding-top: 12px; }

.qi { padding: 10px 0; border-bottom: 1px solid var(--line); }
.qi:last-of-type { border-bottom: 0; }
.qi .q { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.qi .q b { font-size: .9rem; font-weight: 600; }
.qi .q span { font-size: .76rem; color: var(--muted); }
.scale { display: flex; gap: 6px; }
.scale button {
  flex: 1; appearance: none; border: 1px solid var(--line-2); background: var(--surface);
  border-radius: 8px; min-height: 36px; cursor: pointer; font: inherit; font-size: .82rem; color: var(--muted);
}
.scale button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }

/* ---------- avisos ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 90;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: .84rem;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--amber) 8%, var(--surface)); font-size: .84rem; }
.banner.warn { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
.banner.bad { border-color: color-mix(in srgb, var(--red) 50%, var(--line)); background: color-mix(in srgb, var(--red) 6%, var(--surface)); }
.banner.good { border-color: color-mix(in srgb, var(--green) 50%, var(--line)); background: color-mix(in srgb, var(--green) 6%, var(--surface)); }

.fab-print { position: fixed; bottom: 18px; left: 18px; z-index: 50; }

/* ---------- utilidades ---------- */
.hidden { display: none !important; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: .7rem; border: 1px solid var(--line-2); color: var(--muted); }

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function templateFor(n) {
    n = Math.max(2, Math.min(6, n | 0));
    if (n === 2) return clone(TEMPLATE_2);
    if (n === 3) return clone(TEMPLATE_3);
    if (n === 4) return clone(TEMPLATE_4);
    const base = clone(TEMPLATE_4);
    if (n === 5) {
      base.n = 5; base.label = '5 días · 4 sesiones + prioridad';
      base.note = 'Se recortan una o dos series de los accesorios de los 4 días y se añade una sesión corta de prioridad. El total semanal sube poco.';
      // recorte proporcional de accesorios para hacer sitio
      base.days.forEach(d => d.slots.forEach(s => {
        if (['face_pull', 'calf_standing', 'calf_seated', 'leg_ext'].includes(s.ex) && s.sets > 2) s.sets -= 1;
      }));
      base.days.splice(2, 0, clone(ACCESSORY_5));
      return base;
    }
    base.n = 6; base.label = '6 días · 4 sesiones + 2 de prioridad';
    base.note = 'Dos sesiones cortas extra. En déficit, seis días solo se sostienen si el sueño y la proteína están en orden.';
    base.days.forEach(d => d.slots.forEach(s => {
      if (['face_pull', 'calf_standing', 'calf_seated', 'leg_ext', 'abduction'].includes(s.ex) && s.sets > 2) s.sets -= 1;
    }));
    base.days.splice(2, 0, clone(ACCESSORY_5));
    base.days.push(clone(ACCESSORY_6));
    return base;
  }

  /* ------------------------------------------------------------------ *
   * 4. Volumen efectivo y estadísticas
   *    Series efectivas = directas (1,0) + indirectas (0,5 por músculo).
   * ------------------------------------------------------------------ */
  function volumeOf(program, exMap) {
    const vol = {};
    MUSCLES.forEach(m => { vol[m.id] = { direct: 0, indirect: 0, total: 0 }; });
    program.days.forEach(day => day.slots.forEach(s => {
      if (s.optional) return; // las series opcionales no cuentan hasta que se activan
      const e = exOf(s.ex, exMap);
      if (e.primary && vol[e.primary]) vol[e.primary].direct += s.sets;
      else if (e.primary) vol[e.primary] = { direct: s.sets, indirect: 0, total: s.sets };
      (e.secondary || []).forEach(m => { if (vol[m]) vol[m].indirect += s.sets * 0.5; });
    }));
    Object.keys(vol).forEach(k => { vol[k].total = vol[k].direct + vol[k].indirect; });
    return vol;
  }

  function countSets(program, includeOptional) {
    let n = 0;
    program.days.forEach(d => d.slots.forEach(s => { if (!s.optional || includeOptional) n += s.sets; }));
    return n;
  }

  const SET_SECONDS = 40; // tiempo efectivo bajo tensión + transición

  function sessionMinutes(day, exMap) {
    let sec = 8 * 60; // calentamiento
    const supersetGroups = {};
    day.slots.forEach(s => {
      if (s.optional) return;
      const e = exOf(s.ex, exMap);
      const rest = s.rest || e.rest || 90;
      if (s.superset) {
        supersetGroups[s.superset] = supersetGroups[s.superset] || [];
        supersetGroups[s.superset].push({ s, rest });
      } else {
        sec += s.sets * (SET_SECONDS + rest);
      }
    });
    // En superserie el descanso se comparte entre los dos ejercicios.
    Object.keys(supersetGroups).forEach(k => {
      const group = supersetGroups[k];
      const rest = Math.max.apply(null, group.map(g => g.rest));
      const sets = group.reduce((a, g) => a + g.s.sets, 0);
      sec += sets * (SET_SECONDS + rest * 0.55);
    });
    return Math.round(sec / 60);
  }

  function midReps(s) { return (s.reps[0] + s.reps[1]) / 2; }

  function sessionStats(day, loads, exMap) {
    const minutes = sessionMinutes(day, exMap);
    let sets = 0, tonnage = 0, tonnageMin = 0, tonnageMax = 0;
    day.slots.forEach(s => {
      if (s.optional) return;
      const load = (loads && loads[s.ex]) || 0;
      sets += s.sets;
      tonnageMin += s.sets * s.reps[0] * load;
      tonnageMax += s.sets * s.reps[1] * load;
      tonnage += s.sets * midReps(s) * load;
    });
    return { sets: sets, tonnage: Math.round(tonnage), tonnageMin: Math.round(tonnageMin), tonnageMax: Math.round(tonnageMax), minutes: minutes };
  }

  function programStats(program, loads, exMap) {
    const vol = volumeOf(program, exMap);
    let sets = 0, tonnage = 0, tonnageMin = 0, tonnageMax = 0, minutes = 0;
    const sessions = program.days.map(day => {
      const st = sessionStats(day, loads, exMap);
      sets += st.sets; tonnage += st.tonnage; tonnageMin += st.tonnageMin; tonnageMax += st.tonnageMax;
      minutes += st.minutes;
      return Object.assign({ id: day.id, name: day.name, weekday: day.weekday }, st);
    });
    return { sets: sets, tonnage: tonnage, tonnageMin: tonnageMin, tonnageMax: tonnageMax, minutes: minutes, volume: vol, sessions: sessions };
  }

  /* Orden y agrupación únicos para todas las tablas de volumen:
     el deltoides se muestra como una sola fila (suma de sus tres porciones). */
  const VOLUME_ORDER = ['glute', 'ham', 'back', 'deltoids', 'quad', 'chest', 'calf', 'biceps', 'triceps', 'glute_med'];

  function aggregateVolume(vol) {
    return VOLUME_ORDER.map(id => {
      if (id === 'deltoids') {
        const total = (vol.delt_front ? vol.delt_front.total : 0) + (vol.delt_side ? vol.delt_side.total : 0) + (vol.delt_rear ? vol.delt_rear.total : 0);
        return { id: 'deltoids', label: 'Deltoides', total: round1(total), range: [12, 16], aim: 16 };
      }
      return { id: id, label: MUSCLE_LABEL[id] || id, total: round1(vol[id] ? vol[id].total : 0), range: rangeOf(id), aim: aimOf(id) };
    });
  }

  function volumeRows(vol) {
    return aggregateVolume(vol).map(r => {
      const lo = r.range[0], hi = r.range[1];
      let status = 'ok';
      if (r.total < lo - 0.6) status = 'low';
      if (r.total > hi + 0.6) status = 'high';
      return { id: r.id, label: r.label, total: r.total, range: r.range, status: status, aim: r.aim };
    });
  }

  function round1(x) { return Math.round(x * 10) / 10; }
  function roundTo(x, step) { step = step || 2.5; return Math.max(step, Math.round(x / step) * step); }

  /* ------------------------------------------------------------------ *
   * 5. Auto-ajuste de la semana al cambiar la frecuencia
   * ------------------------------------------------------------------ */
  const CAP = { 2: 23, 3: 21, 4: 18, 5: 17, 6: 16 };
  // 67 activas + 2 opcionales = 69, como el documento.
  const TOTAL_TARGET = { 2: 46, 3: 56, 4: 67, 5: 72, 6: 76 };
  function capFor(n) { return CAP[n] || 18; }
  function totalTargetFor(n) { return TOTAL_TARGET[n] || 69; }

  /* Reparte/recorta series hasta acercarse al objetivo semanal, respetando
     el techo por sesión y protegiendo los músculos prioritarios. */
  function fitToTarget(program, exMap) {
    const target = totalTargetFor(program.n);
    const moves = [];
    let guard = 0;
    while (countSets(program) > target && guard++ < 200) {
      // quita de la sesión más cargada, en el accesorio menos prioritario
      const day = program.days.slice().sort((a, b) => countSets({ days: [b] }) - countSets({ days: [a] }))[0];
      const cand = day.slots.filter(s => !s.optional && s.sets > 2 && !PRIORITY.includes(exOf(s.ex, exMap).primary))
        .sort((a, b) => weight(b, exMap) - weight(a, exMap));
      const pick = cand[0] || day.slots.filter(s => !s.optional && s.sets > 1).sort((a, b) => weight(b, exMap) - weight(a, exMap))[0];
      if (!pick) break;
      pick.sets -= 1;
      moves.push({ type: 'remove', ex: pick.ex, name: exOf(pick.ex, exMap).name, session: day.name, sets: 1 });
    }
    guard = 0;
    while (countSets(program) < target && guard++ < 200) {
      const day = program.days.slice().sort((a, b) => countSets({ days: [a] }) - countSets({ days: [b] }))[0];
      if (countSets({ days: [day] }) >= capFor(program.n)) {
        const other = program.days.find(d => countSets({ days: [d] }) < capFor(program.n));
        if (!other) break;
        addSet(other, exMap, moves);
      } else addSet(day, exMap, moves);
    }
    return moves;
  }
  // peso de un ejercicio para decidir qué recortar: menor = menos importante
  function weight(s, exMap) {
    const e = exOf(s.ex, exMap);
    const prio = PRIORITY.includes(e.primary) ? 100 : 0;
    const compound = ['hip_thrust', 'hinge', 'squat', 'lunge', 'push_h', 'push_v', 'pull_v', 'pull_h'].includes(e.pattern) ? 10 : 0;
    return prio + compound + s.sets;
  }
  function addSet(day, exMap, moves) {
    const cand = day.slots.filter(s => !s.optional && s.sets < 5)
      .sort((a, b) => weight(b, exMap) - weight(a, exMap))[0];
    if (!cand) return false;
    cand.sets += 1;
    moves.push({ type: 'add', ex: cand.ex, name: exOf(cand.ex, exMap).name, session: day.name, sets: 1 });
    return true;
  }

  /* Reparto por músculo: sube donde falta, quita donde sobra, respetando techos. */
  function rebalance(program, exMap, opts) {
    opts = opts || {};
    const maxIter = opts.iterations || 12;
    const moves = [];
    for (let it = 0; it < maxIter; it++) {
      const vol = volumeOf(program, exMap);
      const deficits = [], surpluses = [];
      MUSCLES.forEach(m => {
        const total = vol[m.id] ? vol[m.id].total : 0;
        const aim = aimOf(m.id);
        const [lo, hi] = rangeOf(m.id);
        if (aim && total < Math.min(aim, lo) * 0.95) deficits.push({ id: m.id, gap: Math.min(aim, lo) - total });
        if (total > hi + 0.5) surpluses.push({ id: m.id, over: total - hi });
      });
      deficits.sort((a, b) => b.gap - a.gap);
      surpluses.sort((a, b) => b.over - a.over);
      let changed = false;

      if (deficits.length && countSets(program) < totalTargetFor(program.n) + 2) {
        const d = deficits[0];
        const cand = findSlotForMuscle(program, d.id, exMap);
        if (cand) {
          cand.slot.sets += 1; changed = true;
          moves.push({ type: 'add', ex: cand.slot.ex, name: exOf(cand.slot.ex, exMap).name, session: cand.day.name, sets: 1, muscle: d.id });
        }
      }
      if (surpluses.length) {
        const s = surpluses[0];
        if (!PRIORITY.includes(s.id)) {
          const cand = findSlotForMuscle(program, s.id, exMap, { remove: true });
          if (cand) {
            cand.slot.sets -= 1; changed = true;
            moves.push({ type: 'remove', ex: cand.slot.ex, name: exOf(cand.slot.ex, exMap).name, session: cand.day.name, sets: 1, muscle: s.id });
          }
        }
      }
      if (!changed) break;
    }
    return moves;
  }
  function findSlotForMuscle(program, muscleId, exMap, opts) {
    opts = opts || {};
    const limit = opts.remove ? 2 : 5;
    const candidates = [];
    program.days.forEach(day => {
      if (countSets({ days: [day] }) >= capFor(program.n) && !opts.remove) return;
      day.slots.forEach(s => {
        if (s.optional) return;
        const e = exOf(s.ex, exMap);
        if (opts.remove ? (s.sets <= limit) : (s.sets >= limit)) return;
        if (e.primary === muscleId) candidates.push({ day: day, slot: s });
        else if ((e.secondary || []).includes(muscleId) && !opts.remove) candidates.push({ day: day, slot: s, secondary: true });
      });
    });
    // prioriza el ejercicio principal y, si no, el que más aporte
    candidates.sort((a, b) => (a.secondary ? 1 : 0) - (b.secondary ? 1 : 0));
    return candidates[0] || null;
  }

  /* Construye el programa para una frecuencia, con overrides y fase aplicados. */
  function buildProgram(opts) {
    opts = opts || {};
    const n = Math.max(2, Math.min(6, opts.n || 4));
    const exMap = opts.exMap || getExMap(opts.custom);
    const tpl = templateFor(n);
    applyOverrides(tpl, opts.overrides);
    applySwaps(tpl, opts.swaps);
    if (opts.fit !== false) { fitToTarget(tpl, exMap); rebalance(tpl, exMap); }
    if (opts.phase && opts.phase.volume && opts.phase.volume !== 1) applyVolume(tpl, opts.phase.volume);
    return tpl;
  }

  /* Sustituciones guardadas por tipo de sesión: si cambias el hip thrust por
     el de Smith, sigue siendo el de Smith cuando reconstruyes el plan. */
  function applySwaps(program, swaps) {
    if (!swaps) return program;
    program.days.forEach(day => {
      const map = swaps[day.kind] || swaps[day.id];
      if (!map) return;
      day.slots.forEach(slot => { if (map[slot.ex]) slot.ex = map[slot.ex]; });
    });
    return program;
  }

  function applyOverrides(program, overrides) {
    if (!overrides) return program;
    program.days.forEach(day => {
      const ov = overrides[day.id];
      if (!ov) return;
      if (ov.slots) {
        day.slots.forEach((s, i) => {
          const o = ov.slots[i];
          if (!o) return;
          if (o.ex) s.ex = o.ex;
          if (typeof o.sets === 'number') s.sets = o.sets;
          if (o.reps) s.reps = o.reps.slice();
          if (typeof o.rir === 'number') s.rir = o.rir;
          if (typeof o.rest === 'number') s.rest = o.rest;
          if (typeof o.optional === 'boolean') s.optional = o.optional;
        });
      }
    });
    return program;
  }

  function applyVolume(program, factor) {
    program.days.forEach(d => d.slots.forEach(s => {
      s.sets = Math.max(1, Math.round(s.sets * factor));
    }));
    return program;
  }

  /* Diferencia entre dos programas, para enseñar qué cambió al pasar de 4 a 3 días. */
  function diffPrograms(a, b, exMap, loads) {
    const va = aggregateVolume(volumeOf(a, exMap));
    const vb = aggregateVolume(volumeOf(b, exMap));
    const rows = va.map((r, i) => ({
      id: r.id, label: r.label,
      before: r.total,
      after: vb[i] ? vb[i].total : 0,
      delta: round1((vb[i] ? vb[i].total : 0) - r.total)
    })).filter(r => r.before || r.after);
    return {
      muscles: rows,
      sets: { before: countSets(a), after: countSets(b) },
      tonnage: { before: programStats(a, loads, exMap).tonnage, after: programStats(b, loads, exMap).tonnage },
      minutes: { before: programStats(a, loads, exMap).minutes, after: programStats(b, loads, exMap).minutes },
      sessions: { before: a.days.length, after: b.days.length }
    };
  }

  /* ------------------------------------------------------------------ *
   * 6. Fases del bloque
   * ------------------------------------------------------------------ */
  function phaseForWeek(week) {
    if (!week || week < 1) return { id: 'pre', name: 'Antes de empezar', rir: 3, volume: 1, note: 'Calibra cargas en la primera sesión: deja 3 repeticiones en reserva.' };
    if (week === 1) return { id: 'cal', name: 'Calibración', rir: 3, volume: 1, note: 'Cargas que dejen 3 reps en reserva. Sin test de e1RM obligatorio.' };
    if (week <= 5) return { id: 'acc', name: 'Acumulación', rir: week <= 2 ? 2 : 1.5, volume: 1, note: 'El RIR baja de 2 a 1–2 conforme se asientan las cargas.' };
    if (week === 6) return { id: 'del', name: 'Descarga', rir: 3.5, volume: 0.5, note: 'Volumen a la mitad, la carga se mantiene, RIR 3–4.' };
    if (week <= 11) return { id: 'int', name: 'Intensificación', rir: 1.5, volume: 1, note: 'Mismas repeticiones, RIR 1–2: la carga se mantiene mientras suben las repeticiones.' };
    if (week === 12) return { id: 'rev', name: 'Descarga y revisión', rir: 4, volume: 0.5, note: 'Sin re-test de fuerza: medidas, fotos y preparación media del bloque.' };
    return { id: 'ext', name: 'Bloque extra', rir: 1.5, volume: 1, note: 'Si el déficit se extiende: repite desde la semana 1 con las cargas alcanzadas.' };
  }

  /* ------------------------------------------------------------------ *
   * 7. Fechas y semanas
   * ------------------------------------------------------------------ */
  function parseDate(s) {
    if (s instanceof Date) return new Date(s.getFullYear(), s.getMonth(), s.getDate());
    const p = String(s).split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }
  function toISODate(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function mondayOf(d) {
    const x = parseDate(d);
    const dow = x.getDay() === 0 ? 7 : x.getDay();
    x.setDate(x.getDate() - (dow - 1));
    return x;
  }
  function addDays(d, n) {
    const x = parseDate(d); x.setDate(x.getDate() + n); return x;
  }
  function weekNumber(blockStart, date) {
    const a = mondayOf(blockStart), b = mondayOf(date);
    const diff = Math.round((b - a) / 86400000);
    return Math.floor(diff / 7) + 1;
  }
  const WEEKDAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  function weekdayName(i) { return WEEKDAY_NAMES[(i + 6) % 7]; }

  /* ------------------------------------------------------------------ *
   * 8. Progresión
   * ------------------------------------------------------------------ */
  function lastEntryFor(logs, exId) {
    const dates = Object.keys(logs || {}).sort().reverse();
    for (const date of dates) {
      const log = logs[date];
      if (!log || !log.entries) continue;
      const e = log.entries[exId];
      if (e && e.sets && e.sets.some(s => s && (s.reps || s.load))) return { date: date, entry: e, log: log };
    }
    return null;
  }

  function loadHistory(logs, exId) {
    const out = [];
    Object.keys(logs || {}).sort().forEach(date => {
      const e = logs[date] && logs[date].entries && logs[date].entries[exId];
      if (!e || !e.sets || !e.sets.length) return;
      const loads = e.sets.map(s => s.load).filter(v => typeof v === 'number' && v > 0);
      if (!loads.length) return;
      out.push({ date: date, load: Math.max.apply(null, loads), reps: e.sets.map(s => s.reps) });
    });
    return out;
  }

  /* Devuelve el consejo de carga y el texto exacto de la condición. */
  function advise(slotOrEx, logs, loads, exMap) {
    const exId = typeof slotOrEx === 'string' ? slotOrEx : slotOrEx.ex;
    const e = exOf(exId, exMap);
    const base = (loads && loads[exId]) || 0;
    const repsMin = (slotOrEx.reps && slotOrEx.reps[0]) || null;
    const repsMax = (slotOrEx.reps && slotOrEx.reps[1]) || null;
    const targetRir = typeof slotOrEx.rir === 'number' ? slotOrEx.rir : 2;
    const step = e.step || 2.5;
    const last = lastEntryFor(logs, exId);
    const empty = { action: 'calibrar', nextLoad: base, pct: 0, reason: 'Sin datos: es la primera vez. Empieza con la carga de calibración y deja 3 reps en reserva.', condition: 'Semana 1: calibra.', history: { up: 0, down: 0, sessions: 0 } };

    if (!last) return empty;
    const history = countChanges(logs, exId);

    const sets = (last.entry.sets || []).filter(s => s && typeof s.reps === 'number' && s.reps > 0);
    if (!sets.length) {
      return { action: 'mantener', nextLoad: base, pct: 0, reason: 'Faltan repeticiones o RIR en el registro: se repite la carga en lugar de inventar progresión.', condition: 'Registra reps y RIR para poder progresar.', history: history, last: last.date };
    }
    const loadsUsed = sets.map(s => s.load).filter(v => typeof v === 'number' && v > 0);
    const used = loadsUsed.length ? Math.max.apply(null, loadsUsed) : base;
    const minReps = Math.min.apply(null, sets.map(s => s.reps));
    const maxReps = Math.max.apply(null, sets.map(s => s.reps));
    const firstRir = typeof sets[0].rir === 'number' ? sets[0].rir : null;
    const meanRir = mean(sets.filter(s => typeof s.rir === 'number').map(s => s.rir));

    if (repsMax && minReps >= repsMax && (firstRir === null || firstRir >= Math.max(0, targetRir - 1)) && (meanRir === null || meanRir <= targetRir + 1)) {
      const pct = e.incPct || 2.5;
      const up = Math.max(roundTo(used * (1 + pct / 100), step), used + step);
      return {
        action: 'subir', nextLoad: up, pct: pct, from: used,
        reason: 'Todas las series tocaron el techo del rango (' + repsMax + ') con RIR ' + round1(meanRir === null ? targetRir : meanRir) + '. Toca subir un escalón del ' + pct + '%.',
        condition: 'Sube ' + (e.unilateral ? 'por lado ' : '') + 'un ' + pct + '% cuando las ' + sets.length + ' series lleguen a ' + repsMax + ' reps con RIR ' + targetRir + '.',
        history: history, last: last.date
      };
    }
    if (firstRir === 0 || (repsMin && minReps < repsMin)) {
      const next = Math.min(roundTo(used * 0.95, step), used - step);
      return {
        action: 'bajar', nextLoad: next, pct: -5, from: used,
        reason: firstRir === 0 ? 'La primera serie llegó a RIR 0: en déficit no se persigue el fallo.' : 'Una serie quedó por debajo del mínimo del rango (' + repsMin + ').',
        condition: 'Baja un 5 % y sigue: ' + (repsMin || '') + '–' + (repsMax || '') + ' reps con RIR ' + targetRir + '.',
        history: history, last: last.date
      };
    }
    const toGo = repsMax ? Math.max(0, repsMax - minReps) : 0;
    return {
      action: 'mantener', nextLoad: used, pct: 0, from: used,
      reason: toGo > 0 ? 'Faltan ' + toGo + ' repetición' + (toGo === 1 ? '' : 'es') + ' para tocar el techo: misma carga y suma reps.' : 'Mantén la carga: aún no se cumple la condición para subir.',
      condition: 'Sube cuando todas las series lleguen a ' + (repsMax || '?') + ' reps con RIR ' + targetRir + '.',
      history: history, last: last.date
    };
  }

  function countChanges(logs, exId) {
    const hist = loadHistory(logs, exId);
    let up = 0, down = 0;
    for (let i = 1; i < hist.length; i++) {
      if (hist[i].load > hist[i - 1].load + 0.01) up++;
      else if (hist[i].load < hist[i - 1].load - 0.01) down++;
    }
    return { up: up, down: down, sessions: hist.length };
  }

  function mean(arr) {
    if (!arr || !arr.length) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  /* ------------------------------------------------------------------ *
   * 9. Cuestionario de preparación → 0–100 y semáforo
   * ------------------------------------------------------------------ */
  const READINESS_ITEMS = [
    { id: 'sleep',  label: 'Sueño',      hint: '¿Cómo dormiste?',              weight: 1.3, invert: false },
    { id: 'energy', label: 'Energía',    hint: '¿Con ganas de entrenar?',      weight: 1.2, invert: false },
    { id: 'stress', label: 'Estrés',     hint: 'Carga mental y de trabajo',     weight: 1.0, invert: true },
    { id: 'motivation', label: 'Motivación', hint: 'Ganas de hacerlo bien',     weight: 0.8, invert: false },
    { id: 'pain',   label: 'Dolor',      hint: 'Molestias o dolor articular',   weight: 1.2, invert: true },
    { id: 'rpe',    label: 'Sesión previa', hint: 'Cuán duro te dejó',         weight: 0.8, invert: true },
    { id: 'technique', label: 'Técnica', hint: '¿Sientes la técnica sólida?',   weight: 0.9, invert: false },
    { id: 'pump',   label: 'Bombeo',     hint: 'Respuesta muscular al trabajo', weight: 0.6, invert: false },
    { id: 'doms',   label: 'Agujetas',   hint: 'DOMS de días anteriores',       weight: 0.9, invert: true }
  ];

  function readiness(answers) {
    let sum = 0, wsum = 0, answered = 0;
    READINESS_ITEMS.forEach(it => {
      const raw = answers && answers[it.id];
      if (typeof raw !== 'number') return;
      answered++;
      const v = Math.max(0, Math.min(10, raw)); // 0 = peor, 10 = mejor
      const good = it.invert ? 10 - v : v;
      sum += good * it.weight;
      wsum += it.weight;
    });
    if (!answered) return { score: null, light: 'none', advice: 'Sin datos de preparación: entrena con el plan escrito y ajusta por sensación.', items: answered };
    const score = Math.round((sum / wsum) * 10);
    let light = 'red', advice = '';
    if (score >= 75) {
      light = 'green';
      advice = 'Verde: mantén el plan. Si te sobra margen, añade una serie al primer ejercicio, nunca al último.';
    } else if (score >= 50) {
      light = 'amber';
      advice = 'Ámbar: baja una serie en los dos últimos ejercicios y sube el RIR objetivo a 2–3. Hoy no se suben cargas.';
    } else {
      light = 'red';
      advice = 'Rojo: aplica −5 % en toda la sesión, recorta dos series de accesorios y no busques récords. Si se repite dos semanas, adelanta la descarga.';
    }
    return { score: score, light: light, advice: advice, items: answered };
  }

  /* ------------------------------------------------------------------ *
   * 10. Tonelaje real registrado
   * ------------------------------------------------------------------ */
  function logTonnage(log) {
    if (!log || !log.entries) return 0;
    let t = 0;
    Object.keys(log.entries).forEach(exId => {
      const e = log.entries[exId];
      (e.sets || []).forEach(s => {
        if (s && typeof s.reps === 'number' && typeof s.load === 'number') t += s.reps * s.load;
      });
    });
    return Math.round(t);
  }
  function logSets(log) {
    if (!log || !log.entries) return 0;
    let n = 0;
    Object.keys(log.entries).forEach(exId => {
      const e = log.entries[exId];
      n += (e.sets || []).filter(s => s && (s.reps || s.load)).length;
    });
    return n;
  }
  function logByMuscle(log, exMap) {
    const out = {};
    if (!log || !log.entries) return out;
    Object.keys(log.entries).forEach(exId => {
      const e = exOf(exId, exMap);
      const sets = (log.entries[exId].sets || []).filter(s => s && (s.reps || s.load)).length;
      if (!sets) return;
      if (e.primary) out[e.primary] = (out[e.primary] || 0) + sets;
      (e.secondary || []).forEach(m => { out[m] = (out[m] || 0) + sets * 0.5; });
    });
    return out;
  }

  /* Resumen semanal a partir de los registros (semanas naturales desde el lunes). */
  function weeklySummary(state, exMap) {
    const logs = (state && state.logs) || {};
    const weeks = {};
    Object.keys(logs).sort().forEach(date => {
      const wk = toISODate(mondayOf(date));
      weeks[wk] = weeks[wk] || { weekStart: wk, sets: 0, tonnage: 0, sessions: 0, readiness: [], muscles: {} };
      const log = logs[date];
      weeks[wk].sets += logSets(log);
      weeks[wk].tonnage += logTonnage(log);
      weeks[wk].sessions += 1;
      if (log.readiness && typeof log.readiness.score === 'number') weeks[wk].readiness.push(log.readiness.score);
      const bm = logByMuscle(log, exMap);
      Object.keys(bm).forEach(k => { weeks[wk].muscles[k] = round1((weeks[wk].muscles[k] || 0) + bm[k]); });
    });
    return Object.keys(weeks).sort().map(k => {
      const w = weeks[k];
      w.avgReadiness = w.readiness.length ? Math.round(mean(w.readiness)) : null;
      return w;
    });
  }

  /* ------------------------------------------------------------------ *
   * 11. Estado por defecto
   * ------------------------------------------------------------------ */
  function defaultState(today) {
    const t = today ? parseDate(today) : new Date();
    const monday = mondayOf(t);
    const state = {
      version: VERSION,
      athlete: { name: 'Atleta', weightKg: 65, heightCm: 165, kcal: 1675, proteinMin: 1.8, proteinMax: 2.2 },
      block: {
        name: 'Bloque 3 · Hipertrofia en déficit',
        start: toISODate(monday),
        weeks: 12,
        freq: 4,
        supersedes: 'Powerbuilding · 19 de octubre de 2026',
        goal: 'conservar músculo en déficit'
      },
      loads: {},
      overrides: {},
      custom: [],
      logs: {},
      readiness: {},
      measurements: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    state.loads = seedLoads(state);
    return state;
  }

  function seedLoads(state) {
    const bw = (state.athlete && state.athlete.weightKg) || 65;
    const out = {};
    Object.keys(EX_POOL).forEach(id => {
      const e = EX_POOL[id];
      out[id] = e.bwFactor ? roundTo(e.bwFactor * bw, e.step || 2.5) : 0;
    });
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 12. Validación / migración del estado guardado
   * ------------------------------------------------------------------ */
  function normalizeState(s) {
    return _ensureObj(s);
  }
  function _ensureObj(s) {
    const d = defaultState();
    if (!s || typeof s !== 'object') return d;
    const out = Object.assign({}, d, s);
    out.athlete = Object.assign({}, d.athlete, s.athlete || {});
    out.block = Object.assign({}, d.block, s.block || {});
    out.loads = Object.assign({}, d.loads, s.loads || {});
    out.logs = s.logs && typeof s.logs === 'object' ? s.logs : {};
    out.custom = Array.isArray(s.custom) ? s.custom : [];
    out.measurements = Array.isArray(s.measurements) ? s.measurements : [];
    out.version = VERSION;
    if (!out.block.start) out.block.start = d.block.start;
    out.block.freq = Math.max(2, Math.min(6, out.block.freq || 4));
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 13. Autopruebas (se ejecutan con ?selftest=1 o desde node)
   * ------------------------------------------------------------------ */
  function selfTest() {
    const res = [];
    const ok = (name, cond, detail) => res.push({ name: name, pass: !!cond, detail: detail || '' });
    const near = (a, b) => Math.abs(a - b) < 0.05;
    const exMap = getExMap([]);
    const st = defaultState('2026-10-26');
    const p4 = buildProgram({ n: 4, exMap: exMap, loads: st.loads, fit: false });
    const v4 = volumeOf(p4, exMap);
    ok('4 días: 67 series base', countSets(p4) === 67, countSets(p4) + ' series');
    ok('4 días: glúteo 14,5', near(v4.glute.total, 14.5), v4.glute.total);
    ok('4 días: isquios 11,5', near(v4.ham.total, 11.5), v4.ham.total);
    ok('4 días: espalda 11,5', near(v4.back.total, 11.5), v4.back.total);
    ok('4 días: deltoides 16', near(v4.delt_front.total + v4.delt_side.total + v4.delt_rear.total, 16), v4.delt_front.total + v4.delt_side.total + v4.delt_rear.total);
    ok('4 días: pecho 6', near(v4.chest.total, 6), v4.chest.total);
    ok('4 días: pantorrilla 6', near(v4.calf.total, 6), v4.calf.total);
    ok('4 días: 4 sesiones', p4.days.length === 4, p4.days.length);

    for (let n = 2; n <= 6; n++) {
      const p = buildProgram({ n: n, exMap: exMap, loads: st.loads });
      const stats = programStats(p, st.loads, exMap);
      const vol = volumeOf(p, exMap);
      const cap = capFor(n);
      const over = p.days.filter(d => countSets({ days: [d] }) > cap);
      ok(n + ' días: sesiones ≤ ' + cap + ' series', over.length === 0, p.days.map(d => countSets({ days: [d] })).join('/'));
      ok(n + ' días: glúteo ≥ 12', vol.glute.total >= 12, round1(vol.glute.total));
      ok(n + ' días: duración 25–105 min', stats.sessions.every(s => s.minutes >= 25 && s.minutes <= 105), stats.sessions.map(s => s.minutes).join('/'));
      ok(n + ' días: tonelaje > 0', stats.tonnage > 0, stats.tonnage);
    }

    // Progresión
    const logs = {};
    logs['2026-10-26'] = { entries: { bench: { sets: [{ reps: 8, load: 40, rir: 2 }, { reps: 8, load: 40, rir: 2 }, { reps: 8, load: 40, rir: 2 }] } } };
    const advUp = advise({ ex: 'bench', reps: [6, 8], rir: 2 }, logs, { bench: 40 }, exMap);
    ok('progresión: sube al tocar el techo', advUp.action === 'subir' && advUp.nextLoad === 41.25, advUp.action + ' ' + advUp.nextLoad);
    const logs2 = { '2026-10-26': { entries: { bench: { sets: [{ reps: 4, load: 40, rir: 0 }] } } } };
    const advDown = advise({ ex: 'bench', reps: [6, 8], rir: 2 }, logs2, { bench: 40 }, exMap);
    ok('progresión: baja con RIR 0', advDown.action === 'bajar' && advDown.nextLoad === 37.5, advDown.action + ' ' + advDown.nextLoad);
    const advNone = advise({ ex: 'bench', reps: [6, 8], rir: 2 }, {}, { bench: 40 }, exMap);
    ok('progresión: sin datos calibra', advNone.action === 'calibrar', advNone.action);
    const logs3 = { '2026-10-26': { entries: { bench: { sets: [{ reps: 7, load: 40, rir: 2 }] } } } };
    ok('progresión: mantiene si falta reps', advise({ ex: 'bench', reps: [6, 8], rir: 2 }, logs3, { bench: 40 }, exMap).action === 'mantener');

    // Preparación
    const all5 = {}; READINESS_ITEMS.forEach(i => all5[i.id] = 5);
    ok('preparación: neutro = 50 ámbar', readiness(all5).score === 50 && readiness(all5).light === 'amber', readiness(all5).score);
    const all10 = {}; READINESS_ITEMS.forEach(i => all10[i.id] = i.invert ? 0 : 10);
    ok('preparación: perfecto = 100 verde', readiness(all10).score === 100 && readiness(all10).light === 'green', readiness(all10).score);
    const allBad = {}; READINESS_ITEMS.forEach(i => allBad[i.id] = i.invert ? 10 : 0);
    ok('preparación: malo = 0 rojo', readiness(allBad).score === 0 && readiness(allBad).light === 'red', readiness(allBad).score);

    // Fases
    ok('fase semana 1 calibración', phaseForWeek(1).id === 'cal');
    ok('fase semana 6 descarga al 50 %', phaseForWeek(6).volume === 0.5);
    ok('fase semana 12 revisión', phaseForWeek(12).id === 'rev');

    // Fechas
    ok('semana 1 en el lunes de inicio', weekNumber('2026-10-26', '2026-10-26') === 1, weekNumber('2026-10-26', '2026-10-26'));
    ok('semana 2 a los 7 días', weekNumber('2026-10-26', '2026-11-02') === 2, weekNumber('2026-10-26', '2026-11-02'));
    ok('domingo pertenece a la misma semana', weekNumber('2026-10-26', '2026-11-01') === 1, weekNumber('2026-10-26', '2026-11-01'));

    // Descarga
    const deload = buildProgram({ n: 4, exMap: exMap, loads: st.loads, fit: false, phase: phaseForWeek(6) });
    ok('descarga: ~mitad de series', countSets(deload) <= 42 && countSets(deload) >= 28, countSets(deload));

    // Cambio de frecuencia: 4 → 3 mantiene glúteo
    const p3 = buildProgram({ n: 3, exMap: exMap, loads: st.loads });
    const d = diffPrograms(p4, p3, exMap, st.loads);
    ok('4→3: el glúteo no cae más de un 15 %', Math.abs(d.muscles.find(m => m.id === 'glute').delta) / 14.5 <= 0.16, JSON.stringify(d.muscles.find(m => m.id === 'glute')));

    return res;
  }

  return {
    VERSION: VERSION,
    MUSCLES: MUSCLES, MUSCLE_LABEL: MUSCLE_LABEL, RANGE: RANGE, AIM: AIM, PRIORITY: PRIORITY,
    READINESS_ITEMS: READINESS_ITEMS, EX_POOL: EX_POOL, WEEKDAY_NAMES: WEEKDAY_NAMES,
    getExMap: getExMap, exOf: exOf,
    templateFor: templateFor, buildProgram: buildProgram, applyOverrides: applyOverrides,
    volumeOf: volumeOf, countSets: countSets, volumeRows: volumeRows,
    sessionMinutes: sessionMinutes, sessionStats: sessionStats, programStats: programStats,
    fitToTarget: fitToTarget, rebalance: rebalance, diffPrograms: diffPrograms, capFor: capFor, totalTargetFor: totalTargetFor,
    applySwaps: applySwaps,
    phaseForWeek: phaseForWeek, applyVolume: applyVolume,
    parseDate: parseDate, toISODate: toISODate, mondayOf: mondayOf, addDays: addDays, weekNumber: weekNumber, weekdayName: weekdayName,
    advise: advise, lastEntryFor: lastEntryFor, loadHistory: loadHistory, countChanges: countChanges,
    readiness: readiness, logTonnage: logTonnage, logSets: logSets, logByMuscle: logByMuscle, weeklySummary: weeklySummary,
    defaultState: defaultState, seedLoads: seedLoads, normalizeState: normalizeState,
    round1: round1, roundTo: roundTo, selfTest: selfTest
  };
});

    if (attrs) {
      Object.keys(attrs).forEach(k => {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') { if (n instanceof SVGElement) n.setAttribute('class', v); else n.className = v; }
        else if (k === 'text') n.textContent = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k === 'dataset') Object.keys(v).forEach(d => { n.dataset[d] = v[d]; });
        else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v === true) n.setAttribute(k, '');
        else n.setAttribute(k, v);
      });
    }
    for (let i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(n, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(k => add(n, k)); return; }
    n.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

  let toastT = null;
  function toast(msg, action) {
    const t = $('#toast');
    if (!t) return;
    clear(t);
    t.appendChild(document.createTextNode(msg));
    if (action) {
      t.appendChild(el('button', {
        class: 'btn sm', text: action.label,
        onclick: () => { action.onClick(); t.classList.remove('show'); }
      }));
    }
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), action ? 9000 : 2400);
  }

  function debounce(fn, ms) {
    let t = null;
    return function () { const a = arguments, self = this; clearTimeout(t); t = setTimeout(() => fn.apply(self, a), ms); };
  }

  function weekdayOf(dateISO) {
    const d = CE.parseDate(dateISO).getDay();
    return d === 0 ? 7 : d;
  }
  function todayISO() { return CE.toISODate(new Date()); }

  function dateLabel(dateISO) {
    const d = CE.parseDate(dateISO);
    const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return CE.weekdayName(weekdayOf(dateISO)) + ' ' + d.getDate() + ' de ' + months[d.getMonth()];
  }
  function shortDate(dateISO) {
    const d = CE.parseDate(dateISO);
    return d.getDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][d.getMonth()];
  }

  /* ------------------------------------------------------------------ *
   * estado
   * ------------------------------------------------------------------ */
  function readStore() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { storageOK = false; return null; }
  }
  function writeStore() {
    S.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
    catch (e) { storageOK = false; }
    flashSaved();
  }
  let saveT = null;
  function save(now) {
    const s = $('#saveState');
    if (s) { s.classList.add('saving'); s.textContent = 'guardando…'; }
    clearTimeout(saveT);
    if (now) { writeStore(); return; }
    saveT = setTimeout(writeStore, 350);
  }
  let flashT = null;
  function flashSaved() {
    const s = $('#saveState');
    if (!s) return;
    s.classList.remove('saving');
    s.innerHTML = '';
    s.appendChild(el('i', { class: 'dot' }));
    s.appendChild(document.createTextNode(storageOK ? 'guardado' : 'sin guardar'));
    clearTimeout(flashT);
    flashT = setTimeout(() => { if (!storageOK) return; }, 1200);
  }

  function refreshDerived() {
    EX = CE.getExMap(S.custom);
    const base = S.program && S.program.days ? S.program : CE.buildProgram({ n: S.block.freq, exMap: EX, loads: S.loads, swaps: S.swaps });
    S.program = base;
    const ph = CE.phaseForWeek(currentWeek());
    P = ph.volume === 1 ? base : CE.applyVolume(JSON.parse(JSON.stringify(base)), ph.volume);
  }

  function currentWeek() { return CE.weekNumber(S.block.start, todayISO()); }
  function phaseNow() { return CE.phaseForWeek(currentWeek()); }
  function blockWeek(dateISO) { return CE.weekNumber(S.block.start, dateISO || todayISO()); }

  function logFor(dateISO, sessionId) {
    if (!S.logs[dateISO]) S.logs[dateISO] = { sessionId: sessionId || null, entries: {}, readiness: null, note: '', modifier: 0, optional: {} };
    const L = S.logs[dateISO];
    if (sessionId && !L.sessionId) L.sessionId = sessionId;
    if (!L.entries) L.entries = {};
    if (!L.optional) L.optional = {};
    return L;
  }
  function entryFor(dateISO, exId, slot) {
    const L = logFor(dateISO);
    if (!L.entries[exId]) L.entries[exId] = { sets: [], load: S.loads[exId] || 0, adjusted: 0 };
    const e = L.entries[exId];
    if (!e.sets) e.sets = [];
    if (slot) {
      while (e.sets.length < slot.sets) e.sets.push({});
    }
    return e;
  }
  function logsBefore(dateISO) {
    const out = {};
    Object.keys(S.logs).forEach(d => { if (d < dateISO) out[d] = S.logs[d]; });
    return out;
  }
  function sessionDay(dateISO) {
    const wd = weekdayOf(dateISO);
    return P.days.filter(d => d.weekday === wd)[0] || null;
  }
  function dayById(id) { return P.days.filter(d => d.id === id)[0] || null; }

  /* ------------------------------------------------------------------ *
   * cabecera y pestañas
   * ------------------------------------------------------------------ */
  function renderChrome() {
    const week = currentWeek();
    const ph = phaseNow();
    const wc = $('#weekChip');
    if (wc) {
      wc.textContent = week >= 1 ? 'Semana ' + week + ' · ' + ph.name : 'Sin empezar';
      wc.className = 'chip ' + (ph.id === 'del' || ph.id === 'rev' ? 'amber' : ph.id === 'int' ? 'accent' : '');
    }
    const fc = $('#freqChip');
    if (fc) {
      const total = CE.countSets(P);
      fc.textContent = P.days.length + ' días · ' + total + ' series';
    }
    const bn = $('#blockName');
    if (bn) bn.textContent = S.block.name;
    $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === TAB ? 'true' : 'false'));
    document.body.dataset.tab = TAB;
  }

  function go(tab, opts) {
    TAB = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    if (opts && opts.week !== undefined) WEEK_OFFSET = opts.week;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
  }

  /* ------------------------------------------------------------------ *
   * gráficos (SVG a mano)
   * ------------------------------------------------------------------ */
  function barChart(data, opts) {
    opts = opts || {};
    const w = opts.width || 640, h = opts.height || 170, pad = { t: 14, r: 8, b: 22, l: 8 };
    const max = Math.max.apply(null, data.map(d => d.value).concat([1]));
    const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    const bw = innerW / Math.max(1, data.length) * 0.5;
    const svg = el('svg', { class: 'chart', viewBox: '0 0 ' + w + ' ' + h, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': opts.label || 'Gráfico de tonelaje', style: { width: '100%', height: 'auto', aspectRatio: w + ' / ' + h } });
    svg.appendChild(el('line', { class: 'axis', x1: pad.l, y1: h - pad.b, x2: w - pad.r, y2: h - pad.b }));
    data.forEach((d, i) => {
      const x = pad.l + (innerW / Math.max(1, data.length)) * (i + 0.5);
      const bh = (d.value / max) * innerH;
      const y = h - pad.b - bh;
      const bar = el('rect', { class: 'bar' + (d.today ? ' today' : ''), x: x - bw / 2, y: y, width: bw, height: Math.max(1, bh), rx: 2 });
      bar.appendChild(el('title', { text: d.label + ': ' + nf0.format(d.value) + ' kg' }));
      svg.appendChild(bar);
      if (d.label) svg.appendChild(el('text', { x: x, y: h - 6, 'text-anchor': 'middle', text: d.short || d.label }));
    });
    if (opts.target) {
      const y = h - pad.b - (opts.target / max) * innerH;
      svg.appendChild(el('line', { x1: pad.l, y1: y, x2: w - pad.r, y2: y, stroke: 'var(--line-2)', 'stroke-dasharray': '3 3' }));
    }
    return svg;
  }

  function lineChart(points, opts) {
    opts = opts || {};
    const w = opts.width || 640, h = opts.height || 150, pad = { t: 14, r: 10, b: 22, l: 10 };
    const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    const vals = points.map(p => p.y);
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max - min < 1) { max += 1; min -= 1; }
    const svg = el('svg', { class: 'chart', viewBox: '0 0 ' + w + ' ' + h, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': opts.label || 'Evolución', style: { width: '100%', height: 'auto', aspectRatio: w + ' / ' + h } });
    svg.appendChild(el('line', { class: 'axis', x1: pad.l, y1: h - pad.b, x2: w - pad.r, y2: h - pad.b }));
    const X = i => pad.l + (points.length === 1 ? innerW / 2 : (innerW / (points.length - 1)) * i);
    const Y = v => h - pad.b - ((v - min) / (max - min)) * innerH;
    const d = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    if (opts.area !== false && points.length > 1) {
      svg.appendChild(el('path', { class: 'area', d: d + ' L' + X(points.length - 1) + ' ' + (h - pad.b) + ' L' + X(0) + ' ' + (h - pad.b) + ' Z' }));
    }
    svg.appendChild(el('path', { class: 'line', d: d }));
    points.forEach((p, i) => {
      svg.appendChild(el('circle', { cx: X(i), cy: Y(p.y), r: 2.6, fill: 'var(--accent)' }));
      if (p.label) svg.appendChild(el('text', { x: X(i), y: h - 6, 'text-anchor': 'middle', text: p.label }));
    });
    return svg;
  }

  /* ------------------------------------------------------------------ *
   * HOY
   * ------------------------------------------------------------------ */
  function viewToday() {
    const date = PICKED_DATE || todayISO();
    const wrap = el('div', { class: 'stack' });
    const wd = weekdayOf(date);
    let day = sessionDay(date);
    const L = logFor(date, day ? day.id : null);

    /* si el día no tiene sesión asignada pero hay una sesión guardada, se usa esa */
    if (!day && L.sessionId) day = dayById(L.sessionId);
    if (!day && Object.keys(L.entries || {}).length) {
      day = { id: L.sessionId || 'libre', name: 'Sesión libre', focus: 'Sin plantilla', slots: [] };
    }

    /* cabecera */
    const head = el('div', { class: 'session-head' });
    const left = el('div', {});
    left.appendChild(el('div', { class: 'kicker', text: dateLabel(date) + (date === todayISO() ? ' · hoy' : '') }));
    left.appendChild(el('h1', { text: day ? day.name : 'Día de descanso' }));
    left.appendChild(el('div', { class: 'session-focus', text: day ? day.focus : 'Sin sesión programada. El descanso también forma parte del plan.' }));
    head.appendChild(left);

    if (day) {
      const st = CE.sessionStats(day, S.loads, EX);
      const box = el('div', { class: 'session-stats' });
      box.appendChild(el('div', { class: 'stat' }, el('span', { class: 'v', id: 'st-sets', text: String(st.sets) }), el('span', { class: 'k', text: 'series' })));
      box.appendChild(el('div', { class: 'stat' }, el('span', { class: 'v', id: 'st-ton', text: tn(st.tonnage) }), el('span', { class: 'k', text: 'previsto' })));
      box.appendChild(el('div', { class: 'stat' }, el('span', { class: 'v', text: st.minutes + '′' }), el('span', { class: 'k', text: 'estimado' })));
      head.appendChild(box);
    }
    wrap.appendChild(head);

    if (!day) {
      wrap.appendChild(restCard(date, L));
      return wrap;
    }

    const iosHint = iosInstallHint();
    if (iosHint) wrap.appendChild(iosHint);

    /* aviso de descarga */
    const ph = phaseNow();
    if (ph.volume !== 1) {
      wrap.appendChild(el('div', { class: 'banner warn' },
        el('b', { text: 'Semana de descarga. ' }),
        el('span', { text: 'Las series de hoy están a la mitad (' + Math.round(ph.volume * 100) + ' %). La carga se mantiene y el RIR objetivo sube a ' + ph.rir + '. ' + ph.note })
      ));
    }
    if (L.modifier) {
      wrap.appendChild(el('div', { class: 'banner' },
        el('b', { text: 'Sesión al ' + L.modifier + ' %. ' }),
        el('span', { text: 'Se aplicó «hoy está muy pesado». La carga base no cambia.' }),
        el('button', { class: 'btn sm ghost', text: 'quitar', onclick: () => { L.modifier = 0; save(); render(); } })
      ));
    }

    /* preparación */
    wrap.appendChild(readinessCard(date, L));

    if (phaseNow().id === 'cal') {
      wrap.appendChild(el('div', { class: 'banner good' },
        el('b', { text: 'Semana 1: calibración. ' }),
        el('span', { text: 'Deja 3 repeticiones en reserva y no busques récords. Las cargas de partida son una sugerencia calculada sobre tu peso: ajústalas en la primera serie y quedarán fijadas.' })
      ));
    }

    /* ejercicios */
    const list = el('div', {});
    if (!day.slots.length) {
      list.appendChild(el('div', { class: 'empty', text: 'Esta sesión no tiene ejercicios. Añádelos en la pestaña Programa.' }));
    }
    day.slots.forEach((slot, idx) => list.appendChild(exerciseCard(date, day, slot, idx, L)));
    wrap.appendChild(list);

    /* progreso + acciones */
    const done = countDoneSets(L);
    const totalSets = day.slots.reduce((a, s) => a + (s.optional && !L.optional[idxOfSlot(day, s)] ? 0 : s.sets), 0);
    const foot = el('div', { class: 'card' });
    const line = el('div', { class: 'row between' });
    line.appendChild(el('div', { class: 'row', style: { gap: '10px' } },
      el('b', { text: done + ' / ' + totalSets + ' series registradas' }),
      el('span', { class: 'muted tiny', id: 'st-done', text: '' })
    ));
    line.appendChild(el('div', { class: 'row tight' },
      el('button', { class: 'btn sm', text: 'Hoy está muy pesado', onclick: () => heavyDay(L) }),
      el('button', { class: 'btn primary', text: 'Terminar sesión', onclick: () => finishSession(date, day, L) })
    ));
    foot.appendChild(line);
    wrap.appendChild(foot);

    return wrap;
  }

  function idxOfSlot(day, slot) { return day.slots.indexOf(slot); }

  function countDoneSets(L) {
    let n = 0;
    Object.keys(L.entries || {}).forEach(k => {
      (L.entries[k].sets || []).forEach(s => { if (s && s.done) n++; });
    });
    return n;
  }

  function restCard(date, L) {
    const card = el('div', { class: 'card' });
    card.appendChild(el('p', { class: 'hint', text: 'Hoy no hay sesión de tren. Si quieres adelantar o mover el plan, elige una sesión:' }));
    const row = el('div', { class: 'row' });
    P.days.forEach(d => row.appendChild(el('button', {
      class: 'btn sm', text: d.name,
      onclick: () => { L.sessionId = d.id; save(); logFor(date, d.id); render(); }
    })));
    card.appendChild(row);
    const next = P.days.slice().sort((a, b) => ((a.weekday - weekdayOf(date) + 7) % 7) - ((b.weekday - weekdayOf(date) + 7) % 7))[0];
    if (next) {
      card.appendChild(el('hr', { class: 'sep' }));
      card.appendChild(el('p', { class: 'hint', html: 'Siguiente sesión: <b>' + next.name + '</b> · ' + CE.weekdayName(next.weekday) + ' · ' + next.focus }));
    }
    return card;
  }

  function readinessCard(date, L) {
    const card = el('div', { class: 'card tight' });
    const r = L.readiness;
    const line = el('div', { class: 'row between' });
    if (r && typeof r.score === 'number') {
      const color = r.light === 'green' ? 'green' : r.light === 'amber' ? 'amber' : 'red';
      line.appendChild(el('div', { class: 'row' },
        el('span', { class: 'chip ' + color, text: 'Preparación ' + r.score + '/100' }),
        el('span', { class: 'tiny muted', text: r.light === 'green' ? 'verde' : r.light === 'amber' ? 'ámbar' : 'rojo' })
      ));
      line.appendChild(el('button', { class: 'btn sm ghost', text: 'repetir', onclick: () => openReadiness(date, L) }));
      card.appendChild(line);
      card.appendChild(el('p', { class: 'hint', style: { margin: '8px 0 0' }, text: r.advice }));
    } else {
      line.appendChild(el('span', { class: 'muted', html: '<b>¿Cómo llegas hoy?</b> El cuestionario ajusta la sesión: en déficit la preparación manda más que el plan escrito.' }));
      line.appendChild(el('button', { class: 'btn sm', text: 'Responder', onclick: () => openReadiness(date, L) }));
      card.appendChild(line);
    }
    return card;
  }

  function exerciseCard(date, day, slot, idx, L) {
    const ex = CE.exOf(slot.ex, EX);
    const isOptionalOff = slot.optional && !L.optional[idx];
    const entry = entryFor(date, slot.ex, isOptionalOff ? null : slot);
    const advised = CE.advise({ ex: slot.ex, reps: slot.reps, rir: slot.rir }, logsBefore(date), S.loads, EX);
    const last = CE.lastEntryFor(logsBefore(date), slot.ex);
    const card = el('article', { class: 'ex' });

    /* cabecera */
    const head = el('div', { class: 'ex-head' });
    const title = el('div', { class: 'ex-title' });
    title.appendChild(el('b', {}, ex.name, slot.optional ? el('span', { class: 'pill opt', style: { marginLeft: '8px' }, text: 'opcional' }) : null));
    title.appendChild(el('span', { class: 'spec', text: slot.sets + ' × ' + slot.reps[0] + '–' + slot.reps[1] + ' · RIR ' + slot.rir + ' · ' + fmtRest(slot.rest || ex.rest) + ' descanso' }));
    if (last) {
      const sets = last.entry.sets.filter(s => s && s.reps);
      const maxLoad = Math.max.apply(null, sets.map(s => s.load || 0).concat([0]));
      title.appendChild(el('span', { class: 'prev', text: 'última vez (' + shortDate(last.date) + '): ' + kg(maxLoad) + ' kg · ' + sets.map(s => s.reps).join('/') }));
    }
    head.appendChild(title);

    if (!isOptionalOff) {
      const tools = el('div', { class: 'row tight' });
      const loadBox = el('div', { class: 'stepper' });
      const val = el('span', { class: 'val', id: 'load-' + idx, text: kg(entry.load || 0) });
      loadBox.appendChild(el('button', { text: '−', 'aria-label': 'bajar carga', onclick: () => bumpLoad(date, slot, entry, -1 * (ex.step || 2.5)) }));
      loadBox.appendChild(val);
      loadBox.appendChild(el('button', { text: '+', 'aria-label': 'subir carga', onclick: () => bumpLoad(date, slot, entry, (ex.step || 2.5)) }));
      tools.appendChild(loadBox);
      tools.appendChild(el('span', { class: 'tiny muted', text: 'kg' }));
      head.appendChild(tools);
    } else {
      head.appendChild(el('button', { class: 'btn sm', text: 'Incluir hoy', onclick: () => { L.optional[idx] = true; save(); render(); } }));
    }
    card.appendChild(head);

    if (isOptionalOff) {
      card.appendChild(el('div', { class: 'ex-body' }, el('span', { class: 'tiny muted', text: 'Fuera del cómputo hasta que la actives. Es la palanca barata para subir cuádriceps.' })));
      return card;
    }

    const body = el('div', { class: 'ex-body' });
    body.appendChild(el('div', { class: 'set-labels' },
      el('span', { text: '#' }), el('span', { text: 'kg' }), el('span', { text: 'reps' }), el('span', { text: 'rir' }), el('span', { text: '' })
    ));
    const sets = el('div', { class: 'sets' });
    for (let i = 0; i < slot.sets; i++) {
      const st = entry.sets[i] || (entry.sets[i] = {});
      const row = el('div', { class: 'set-row' });
      row.appendChild(el('span', { class: 'idx', text: String(i + 1) }));
      row.appendChild(el('input', {
        type: 'number', inputmode: 'decimal', step: 'any', min: '0', value: st.load != null ? st.load : (entry.load || ''), placeholder: 'kg',
        'aria-label': 'kilos serie ' + (i + 1),
        oninput: (ev) => { st.load = num(ev.target.value); if (i === 0) entry.load = st.load; touch(date); }
      }));
      row.appendChild(el('input', {
        type: 'number', inputmode: 'numeric', step: '1', min: '0', value: st.reps != null ? st.reps : '', placeholder: slot.reps[0] + '–' + slot.reps[1],
        'aria-label': 'repeticiones serie ' + (i + 1),
        oninput: (ev) => { st.reps = ev.target.value === '' ? undefined : num(ev.target.value); touch(date); }
      }));
      row.appendChild(el('input', {
        type: 'number', inputmode: 'decimal', step: '0.5', min: '0', max: '5', value: st.rir != null ? st.rir : '', placeholder: String(slot.rir),
        'aria-label': 'RIR serie ' + (i + 1),
        oninput: (ev) => { st.rir = ev.target.value === '' ? undefined : num(ev.target.value); touch(date); }
      }));
      row.appendChild(el('button', {
        class: 'check', 'aria-checked': st.done ? 'true' : 'false', title: 'Marcar serie',
        text: st.done ? '✓' : '',
        onclick: () => toggleSet(date, day, slot, entry, i, st)
      }));
      sets.appendChild(row);
    }
    body.appendChild(sets);

    /* consejo de progresión */
    if (advised && advised.action !== 'calibrar') {
      const cls = advised.action === 'subir' ? 'up' : advised.action === 'bajar' ? 'down' : '';
      const box = el('div', { class: 'advice ' + cls });
      box.appendChild(el('span', { class: 'ico', text: advised.action === 'subir' ? '↑' : advised.action === 'bajar' ? '↓' : '=' }));
      const txt = el('div', {});
      txt.appendChild(el('div', { html: '<b>' + adviseTitle(advised) + '</b> ' + esc(advised.reason) }));
      txt.appendChild(el('div', { class: 'tiny muted', text: advised.condition }));
      box.appendChild(txt);
      if (advised.action === 'subir' && Math.abs(advised.nextLoad - (entry.load || 0)) > 0.01) {
        box.appendChild(el('button', {
          class: 'btn sm', text: 'usar ' + kg(advised.nextLoad) + ' kg',
          onclick: () => { entry.load = advised.nextLoad; entry.sets.forEach(s => { if (!s.done) s.load = advised.nextLoad; }); save(); render(); }
        }));
      }
      body.appendChild(box);
    }

    /* pie */
    const foot = el('div', { class: 'ex-foot' });
    const left = el('div', { class: 'load-edit' });
    if (Math.abs((entry.load || 0) - (S.loads[slot.ex] || 0)) > 0.01) {

  let TIMER = { end: 0, total: 0, label: '', on: false };
  let timerRAF = null;
  let audioCtx = null;

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [0, 0.18, 0.36].forEach((t, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = i === 2 ? 1040 : 880;
        o.type = 'sine';
        g.gain.setValueAtTime(0, now + t);
        g.gain.linearRampToValueAtTime(0.12, now + t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.14);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + t); o.stop(now + t + 0.16);
      });
    } catch (e) { /* sin audio */ }
  }

  function startTimer(seconds, label) {
    TIMER = { end: Date.now() + seconds * 1000, total: seconds, label: label || 'descanso', on: true };
    const box = $('#timer');
    if (box) box.classList.remove('hidden', 'done');
    tick();
  }
  function stopTimer() {
    TIMER.on = false;
    const box = $('#timer');
    if (box) box.classList.add('hidden');
  }
  function tick() {
    if (!TIMER.on) return;
    const left = Math.max(0, Math.round((TIMER.end - Date.now()) / 1000));
    const box = $('#timer');
    if (!box) return;
    const t = $('#timerTime');
    if (t) t.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    const lab = $('#timerLabel');
    if (lab) lab.textContent = TIMER.label;
    if (left <= 0) {
      box.classList.add('done');
      beep();
      TIMER.on = false;
      return;
    }
    timerRAF = setTimeout(tick, 250);
  }
